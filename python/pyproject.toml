[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "salman-40-crypto-sdk"
description = "Production-grade cryptographic SDK for salman 40"
version = "2.0.0"
requires-python = ">=3.7"
dependencies = [
    "cryptography>=3.0.0",
    "pycryptodome>=3.15.0"
]

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-cov",
    "pytest-benchmark"
]
dev = [
    "black",
    "flake8",
    "mypy"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--cov=averox_crypto", "--cov-report=html"]

[tool.black]
line-length = 88
target-version = ['py37']